<!DOCTYPE html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0c"><meta name="color-scheme" content="dark">
<meta name="description" content="Локальный зашифрованный дневник тренировок"><title>Тренировки 2.0 · Разработка</title>
<link rel="apple-touch-icon" href="./assets/icon-180.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./assets/icon.svg"><link rel="stylesheet" href="./style.css"></head>
<body>
<div id="auth" class="auth-screen"><section class="auth-card"><div class="brand"><span class="brand-icon">▥</span> Тренировки <small>2.0 · тестовая версия</small></div><h1 id="auth-title">Защищённый дневник</h1><p id="auth-desc" class="muted">Личные данные хранятся только на устройстве в зашифрованном виде.</p><form id="auth-form"><label>Пароль<input id="auth-pass" type="password" autocomplete="current-password" minlength="12" required placeholder="Не менее 12 символов"></label><label id="auth-confirm-wrap" hidden>Повтори пароль<input id="auth-confirm" type="password" autocomplete="new-password" minlength="12"></label><p class="error" id="auth-error" role="alert"></p><button id="auth-submit" class="primary" type="submit">Открыть</button></form><button id="auth-import-v1" class="secondary" type="button" hidden>Перенести из зашифрованной копии 1.0</button><input type="file" id="auth-import-file" accept=".json,application/json" hidden><p class="footnote">Пароль не отправляется на сервер. Восстановление забытого пароля невозможно. Данные 1.0 при переносе остаются в старом хранилище.</p></section></div>
<div id="app" hidden><header class="appbar"><span class="brand"><span class="brand-icon">▥</span> Тренировки</span><span class="buildtag">v2 · dev</span></header><main id="panel"></main><nav id="tabs" aria-label="Разделы приложения">
<button data-tab="today"><span>⌂</span>Сегодня</button><button data-tab="calendar"><span>▦</span>Календарь</button><button data-tab="programs"><span>▱</span>Программы</button><button data-tab="progress"><span>▥</span>Прогресс</button><button data-tab="profile"><span>♙</span>Профиль</button></nav></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-body"><button id="dialog-close" class="close" aria-label="Закрыть">×</button><h2 id="dialog-title"></h2><div id="dialog-content"></div></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div><input type="file" id="backup-file" accept=".json,application/json" hidden>
<script type="module" src="./js/app.mjs"></script></body></html>
